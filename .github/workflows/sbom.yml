name: CycloneDX SBOM

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install cyclonedx-npm
        run: npm install -g @cyclonedx/cyclonedx-npm@1.16.1

      - name: Generate CycloneDX SBOM
        run: cyclonedx-npm --output-file sbom.json --output-format json

      - name: Show SBOM contents (debug)
        run: |
          echo "=== First 50 lines of sbom.json ==="
          head -50 sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.json

      - name: Send SBOM to Challenge Listener
        run: |
          echo "Posting SBOM to Challenge Listener..."
          curl -X POST -H "Content-Type: multipart/form-data" \
            -F "file=@sbom.json" \
            http://35.219.170.113:8880/callback
